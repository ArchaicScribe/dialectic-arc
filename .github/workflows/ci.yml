name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DialecticArc.sln

      - name: Build
        run: dotnet build DialecticArc.sln --no-restore --configuration Release
